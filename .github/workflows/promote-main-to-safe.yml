name: Promote Main to Safe

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type PROMOTE to copy the current main commit to Safe"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: promote-main-to-safe
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - name: Verify confirmation
        if: ${{ inputs.confirmation != 'PROMOTE' }}
        run: |
          echo "Confirmation was not PROMOTE. No changes were made."
          exit 1

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Promote main to Safe
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA="$(git rev-parse HEAD)"
          SAFE_SHA="$(git rev-parse origin/Safe 2>/dev/null || true)"

          echo "main: $MAIN_SHA"
          echo "Safe: ${SAFE_SHA:-<unknown>}"

          if [ "$MAIN_SHA" = "$SAFE_SHA" ]; then
            echo "Safe already points to the current main commit."
            exit 0
          fi

          git push origin "HEAD:refs/heads/Safe"

      - name: Summary
        run: |
          echo "The current main commit was promoted to Safe."
