name: Safe Windows Release

on:
  push:
    branches:
      - Safe
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: safe-windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout Safe
        uses: actions/checkout@v4
        with:
          ref: Safe

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.425"

      - name: Verify .NET SDK
        run: dotnet --version

      - name: Validate Windows project sources
        shell: pwsh
        run: |
          $files = @(
            "windows/Ecosys.Windows/Ecosys.Windows.csproj",
            "windows/Ecosys.Windows/Program.cs",
            "windows/Ecosys.Windows/Transport/BluetoothTransport.cs"
          )
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "Required source file is missing: $file" }
            $text = Get-Content $file -Raw
            if ($text.Contains("\\n")) { throw "Literal \\n sequence found in $file. Refusing to publish a broken build." }
          }

      - name: Restore Windows project
        run: dotnet restore windows/Ecosys.Windows/Ecosys.Windows.csproj

      - name: Build Windows project
        run: dotnet build windows/Ecosys.Windows/Ecosys.Windows.csproj --configuration Release --no-restore

      - name: Publish self-contained Windows app
        run: >
          dotnet publish windows/Ecosys.Windows/Ecosys.Windows.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output dist/publish
          -p:PublishSingleFile=false
          -p:IncludeNativeLibrariesForSelfExtract=false

      - name: Create Safe application archive
        shell: pwsh
        run: |
          Compress-Archive -Path dist/publish/* -DestinationPath dist/Ecosys-windows-safe.zip
          (Get-FileHash dist/Ecosys-windows-safe.zip -Algorithm SHA256).Hash |
            Out-File dist/Ecosys-windows-safe.zip.sha256 -Encoding ascii

      - name: Install Inno Setup
        shell: pwsh
        run: |
          winget install --id JRSoftware.InnoSetup.7 -e --accept-package-agreements --accept-source-agreements --silent

      - name: Locate Inno Setup
        shell: pwsh
        run: |
          $candidates = @(
            (Join-Path $env:LOCALAPPDATA "Programs\Inno Setup 7\ISCC.exe"),
            (Join-Path $env:LOCALAPPDATA "Programs\Inno Setup 6\ISCC.exe"),
            (Join-Path $env:ProgramFiles "Inno Setup 7\ISCC.exe"),
            (Join-Path ${env:ProgramFiles(x86)} "Inno Setup 7\ISCC.exe"),
            (Join-Path $env:ProgramFiles "Inno Setup 6\ISCC.exe"),
            (Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe")
          )
          $iscc = $candidates | Where-Object { Test-Path $_ -PathType Leaf } | Select-Object -First 1
          if (-not $iscc) {
            $command = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($command) { $iscc = $command.Source }
          }
          if (-not $iscc) { throw "ISCC.exe was not found after installing Inno Setup." }
          Write-Host "Using Inno Setup compiler: $iscc"
          "ISCC_PATH=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8

      - name: Build online installer
        shell: pwsh
        run: |
          & "$env:ISCC_PATH" installer/Ecosys.iss

      - name: Build offline installer
        shell: pwsh
        run: |
          & "$env:ISCC_PATH" /DOfflineMode /F"Ecosys-Offline-Setup" installer/Ecosys.iss

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "safe-$env:GITHUB_RUN_NUMBER"
          gh release create $tag `
            "dist/Ecosys-windows-safe.zip" `
            "dist/Ecosys-windows-safe.zip.sha256" `
            "installer/Output/Ecosys-Setup.exe" `
            "installer/Output/Ecosys-Offline-Setup.exe" `
            --target Safe `
            --title "Ecosys Safe $tag" `
            --notes "Automated safe-channel build from the Safe branch." `
            --latest
