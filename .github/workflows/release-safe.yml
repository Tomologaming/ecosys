name: Ecosys Safe Windows Release

on:
  push:
    branches:
      - Safe
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ecosys-safe-windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout Safe
        uses: actions/checkout@v4
        with:
          ref: Safe
          fetch-depth: 1

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.425"

      - name: Verify .NET SDK
        shell: pwsh
        run: dotnet --version

      - name: Restore Windows project
        shell: pwsh
        run: dotnet restore windows/Ecosys.Windows/Ecosys.Windows.csproj --runtime win-x64

      - name: Build Windows project
        shell: pwsh
        run: dotnet build windows/Ecosys.Windows/Ecosys.Windows.csproj --configuration Release --runtime win-x64 --no-restore

      - name: Publish self-contained Windows app
        shell: pwsh
        run: >
          dotnet publish windows/Ecosys.Windows/Ecosys.Windows.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output dist/publish
          --no-restore
          -p:PublishSingleFile=false
          -p:IncludeNativeLibrariesForSelfExtract=false

      - name: Smoke test Windows application startup
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/publish/Ecosys.Windows.exe").Path
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 5
          if ($process.HasExited) {
            throw "Ecosys.Windows.exe exited during startup with code $($process.ExitCode)."
          }
          Stop-Process -Id $process.Id -Force

      - name: Verify published application
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/publish/Ecosys.Windows.exe")) {
            throw "Published Ecosys.Windows.exe was not found."
          }
          if (-not (Test-Path "installer/Ecosys.iss")) {
            throw "installer/Ecosys.iss was not found."
          }
          if (-not (Test-Path "windows/Ecosys.Windows/Assets/ecosys.ico")) {
            throw "Windows application icon was not found."
          }

      - name: Create Safe application archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path dist/publish/* -DestinationPath dist/Ecosys-windows-safe.zip -Force
          (Get-FileHash dist/Ecosys-windows-safe.zip -Algorithm SHA256).Hash |
            Set-Content dist/Ecosys-windows-safe.zip.sha256 -Encoding ascii

      - name: Install Inno Setup
        shell: pwsh
        run: |
          winget source update
          winget install --id JRSoftware.InnoSetup.7 -e -s winget `
            --accept-package-agreements `
            --accept-source-agreements `
            --silent `
            --disable-interactivity

      - name: Locate Inno Setup
        shell: pwsh
        run: |
          $candidates = @(
            (Join-Path $env:LOCALAPPDATA "Programs\Inno Setup 7\ISCC.exe"),
            (Join-Path $env:LOCALAPPDATA "Programs\Inno Setup 6\ISCC.exe"),
            (Join-Path $env:ProgramFiles "Inno Setup 7\ISCC.exe"),
            (Join-Path ${env:ProgramFiles(x86)} "Inno Setup 7\ISCC.exe"),
            (Join-Path $env:ProgramFiles "Inno Setup 6\ISCC.exe"),
            (Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe")
          )

          $iscc = $candidates |
            Where-Object { Test-Path $_ -PathType Leaf } |
            Select-Object -First 1

          if (-not $iscc) {
            $command = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($command) {
              $iscc = $command.Source
            }
          }

          if (-not $iscc) {
            throw "ISCC.exe was not found after installing Inno Setup."
          }

          Write-Host "Using Inno Setup compiler: $iscc"
          "ISCC_PATH=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build online installer
        shell: pwsh
        run: |
          & "$env:ISCC_PATH" installer/Ecosys.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "installer/Output/Ecosys-Setup.exe")) {
            throw "Online installer was not created."
          }

      - name: Build offline installer
        shell: pwsh
        run: |
          & "$env:ISCC_PATH" /DOfflineMode /F"Ecosys-Offline-Setup" installer/Ecosys.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "installer/Output/Ecosys-Offline-Setup.exe")) {
            throw "Offline installer was not created."
          }

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "safe-$env:GITHUB_RUN_NUMBER"
          gh release create $tag `
            "dist/Ecosys-windows-safe.zip" `
            "dist/Ecosys-windows-safe.zip.sha256" `
            "installer/Output/Ecosys-Setup.exe" `
            "installer/Output/Ecosys-Offline-Setup.exe" `
            --target Safe `
            --title "Ecosys Safe $tag" `
            --notes "Automated safe-channel build from the Safe branch." `
            --latest
