name: Build iOS for AltStore Classic

on:
  push:
    branches:
      - Safe
    paths:
      - 'ios/**'
      - 'altstore/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Safe

      - name: Prepare app icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ios/Ecosys/Assets.xcassets/AppIcon.appiconset
          curl -L --fail --retry 3 \
            -o ios/Ecosys/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png \
            https://raw.githubusercontent.com/Tomologaming/ecosys/Safe/icon/ecosys.png

      - name: Build unsigned iOS app
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/Ecosys.xcodeproj \
            -scheme Ecosys \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA for AltStore Classic
        shell: bash
        run: |
          set -euo pipefail
          APP="build/DerivedData/Build/Products/Release-iphoneos/Ecosys.app"
          test -d "$APP"
          # The Share Extension is nested executable code. Sideloadly must sign it
          # with the same device/team identity as the containing app, so never ship
          # stale signatures from the unsigned Xcode build.
          test -d "$APP/PlugIns/EcosysShare.appex"
          test -f "$APP/PlugIns/EcosysShare.appex/EcosysShare"
          find "$APP" -type d -name "_CodeSignature" -prune -exec rm -rf {} +
          find "$APP" -type f -perm -111 -exec codesign --remove-signature {} \; 2>/dev/null || true
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/Ecosys.app
          cd build
          zip -qry Ecosys.ipa Payload
          test -s Ecosys.ipa
          echo "IPA_SIZE=$(stat -f%z Ecosys.ipa)" >> "$GITHUB_ENV"

      - name: Update source size
        if: github.ref == 'refs/heads/Safe'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          path = "altstore/source.json"
          with open(path, encoding="utf-8") as f:
              source = json.load(f)
          source["apps"][0]["versions"][0]["size"] = int(os.environ["IPA_SIZE"])
          with open(path, "w", encoding="utf-8") as f:
              json.dump(source, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add altstore/source.json
          if ! git diff --cached --quiet; then
            git commit -m "Update AltStore IPA size"
            git push origin HEAD:Safe
          fi

      - name: Publish IPA to stable GitHub release
        if: github.ref == 'refs/heads/Safe'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view ios-altstore >/dev/null 2>&1; then
            gh release create ios-altstore \
              --title "Ecosys iOS for AltStore Classic" \
              --notes "Automated unsigned iOS IPA for installation through AltStore Classic. This release is updated by the Safe-branch iOS workflow." \
              --prerelease
          fi
          gh release upload ios-altstore build/Ecosys.ipa --clobber

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ecosys-iOS-AltStore-IPA
          path: build/Ecosys.ipa
          retention-days: 30
