name: Build iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare app icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ios/Ecosys/Assets.xcassets/AppIcon.appiconset
          ICON="icon/ecosys.png"
          TARGET="ios/Ecosys/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"
          test -s "$ICON"
          # The repository icon is the master artwork; Xcode requires the app-icon
          # slot to contain an exact 1024x1024 PNG.
          sips --resampleHeightWidth 1024 1024 "$ICON" --out "$TARGET" >/dev/null
          test -s "$TARGET"
          WIDTH="$(sips -g pixelWidth "$TARGET" | awk '/pixelWidth/ {print $2}')"
          HEIGHT="$(sips -g pixelHeight "$TARGET" | awk '/pixelHeight/ {print $2}')"
          test "$WIDTH" = "1024"
          test "$HEIGHT" = "1024"
          file "$TARGET"

      - name: Verify project and scheme
        run: |
          set -euo pipefail
          xcodebuild -list -project ios/Ecosys.xcodeproj
          plutil -lint ios/Ecosys/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundlePackageType' ios/Ecosys/Info.plist)" = "APPL"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSBluetoothAlwaysUsageDescription' ios/Ecosys/Info.plist | wc -c)" -gt 10

      - name: Build iOS app for Sideloadly
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/Ecosys.xcodeproj \
            -scheme Ecosys \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Prepare clean unsigned app bundle for Sideloadly
        shell: bash
        run: |
          set -euo pipefail
          APP="build/DerivedData/Build/Products/Release-iphoneos/Ecosys.app"
          test -d "$APP"
          # Sideloadly must apply the device-specific Apple signature itself.
          # Remove any stale signatures from nested code objects as well.
          find "$APP" -type d -name "_CodeSignature" -prune -exec rm -rf {} +
          find "$APP" -type f -name "*.dylib" -exec codesign --remove-signature {} + 2>/dev/null || true
          find "$APP" -depth -type d -name "*.framework" -exec codesign --remove-signature {} + 2>/dev/null || true
          # The finished bundle must carry the app icon and the Bluetooth usage text,
          # otherwise iOS refuses to install or crashes on the first BLE call.
          test -f "$APP/AppIcon60x60@2x.png" || test -f "$APP/Assets.car"
          /usr/libexec/PlistBuddy -c 'Print :NSBluetoothAlwaysUsageDescription' "$APP/Info.plist" >/dev/null

      - name: Package IPA for Sideloadly
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/Ecosys.app build/Payload/Ecosys.app
          cd build
          zip -qry Ecosys-sideloadly.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ecosys-iOS-sideloadly-ipa
          path: build/Ecosys-sideloadly.ipa
          retention-days: 30

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: Ecosys-iOS-app-bundle
          path: build/Payload/Ecosys.app
          retention-days: 30
