name: Build iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare app icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ios/Ecosys/Assets.xcassets/AppIcon.appiconset
          cp icon/ecosys.png ios/Ecosys/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
          test -s ios/Ecosys/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png

      - name: Build iOS app for Sideloadly
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/Ecosys.xcodeproj \
            -scheme Ecosys \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Prepare clean unsigned app bundle for Sideloadly
        shell: bash
        run: |
          set -euo pipefail
          APP="build/DerivedData/Build/Products/Release-iphoneos/Ecosys.app"
          test -d "$APP"
          # Sideloadly must apply the device-specific Apple signature itself.
          # Remove any stale signatures from nested code objects as well.
          find "$APP" -type d -name "_CodeSignature" -prune -exec rm -rf {} +
          find "$APP" -type f \( -name "*.dylib" -o -name "*.framework" \) -exec codesign --remove-signature {} + 2>/dev/null || true

      - name: Package IPA for Sideloadly
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/Ecosys.app build/Payload/Ecosys.app
          cd build
          zip -qry Ecosys-sideloadly.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ecosys-iOS-sideloadly-ipa
          path: build/Ecosys-sideloadly.ipa
          retention-days: 30

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: Ecosys-iOS-app-bundle
          path: build/Payload/Ecosys.app
          retention-days: 30
