name: Build Windows Client

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: "Name for this build/artifact"
        required: true
        type: string
        default: "Ecosys-windows"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: dotnet build windows/Ecosys.sln --configuration Release

      - name: Publish
        run: dotnet publish windows/Ecosys.Windows/Ecosys.Windows.csproj --configuration Release --output dist

      - name: Create ZIP
        shell: pwsh
        env:
          BUILD_NAME: ${{ inputs.build_name }}
        run: Compress-Archive -Path dist/* -DestinationPath "${env:BUILD_NAME}.zip"

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.build_name }}
          path: "${{ inputs.build_name }}.zip"
          if-no-files-found: error
          retention-days: 30
